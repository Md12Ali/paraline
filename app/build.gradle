plugins {
    id 'com.android.application'
}

// Release signing comes from the environment (set by the GitHub workflow).
def keystoreFile = System.getenv('KEYSTORE_FILE')
def keystorePassword = System.getenv('KEYSTORE_PASSWORD')
def canSign = keystoreFile && keystorePassword && file(keystoreFile).exists()

android {
    namespace = 'com.paraline.rewriter'
    compileSdk = 36

    defaultConfig {
        // The app's permanent ID on Google Play. Change it BEFORE the first upload if you want your own.
        applicationId = 'com.paraline.rewriter'
        minSdk = 24
        targetSdk = 36
        // Google Play needs a higher number for every upload; the workflow run number provides it.
        versionCode = (System.getenv('GITHUB_RUN_NUMBER') ?: '1') as Integer
        versionName = '1.0.' + (System.getenv('GITHUB_RUN_NUMBER') ?: '0')
    }

    signingConfigs {
        // A fixed key kept in this private repo, so every new build installs over the previous one.
        debug {
            storeFile = file('debug.keystore')
            storePassword = 'android'
            keyAlias = 'androiddebugkey'
            keyPassword = 'android'
        }
        release {
            if (canSign) {
                storeFile = file(keystoreFile)
                storePassword = keystorePassword
                keyAlias = 'upload'
                keyPassword = keystorePassword
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled = false
            if (canSign) {
                signingConfig = signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    lint {
        abortOnError = false
        checkReleaseBuilds = false
    }
}
